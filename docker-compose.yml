# Quick start:
#   cp .env.example .env   # then edit JWT_SECRET_KEY, OPENAI_API_KEY, etc.
#   docker compose up --build
#
# Frontend: http://localhost:3000
# API docs: http://localhost:8000/docs
#
# `version:` key intentionally omitted -- obsolete in current Docker
# Compose (v2), which warns if present.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resume_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-resume_scanner}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resume_scanner}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [resume_scanner_net]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [resume_scanner_net]

  backend:
    build:
      context: ./backend
    image: resume-scanner-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-resume_scanner}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-resume_scanner}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-real-random-secret}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10/minute}
      RATE_LIMIT_ANALYSIS: ${RATE_LIMIT_ANALYSIS:-20/minute}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-120/minute}
    ports:
      - "8000:8000"
    networks: [resume_scanner_net]

  celery-worker:
    image: resume-scanner-backend:latest
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-resume_scanner}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-resume_scanner}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-real-random-secret}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Only the `backend` service runs migrations on startup (see
      # docker-entrypoint.sh) -- prevents two containers racing to
      # apply the same alembic revision when both start at once.
      RUN_MIGRATIONS: "false"
    command: ["celery", "-A", "app.infrastructure.tasks.celery_app", "worker", "--loglevel=info"]
    networks: [resume_scanner_net]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks: [resume_scanner_net]

networks:
  resume_scanner_net:
    driver: bridge

volumes:
  postgres_data:
