name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    # Real services, not mocks -- mirrors exactly how this project's
    # test suite was actually developed and verified (see backend/README.md).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resume_scanner
          POSTGRES_PASSWORD: resume_scanner_dev
          POSTGRES_DB: resume_scanner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resume_scanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl

      - name: Run migrations (dev + test databases)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://resume_scanner:resume_scanner_dev@localhost:5432/resume_scanner_test
        run: alembic upgrade head

      - name: Run test suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://resume_scanner:resume_scanner_dev@localhost:5432/resume_scanner_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=90

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
